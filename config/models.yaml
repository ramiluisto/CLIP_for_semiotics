# Model configurations for different use cases

models:
  # Lightweight model for quick testing
  small:
    name: "openai/clip-vit-base-patch32"
    batch_size: 32
    precision: "float32"
    description: "Fast model suitable for quick prototyping"

  # Balanced model for general use
  medium:
    name: "openai/clip-vit-base-patch16"
    batch_size: 16
    precision: "float32"
    description: "Balanced model with good accuracy and speed"

  # High accuracy model for research
  large:
    name: "openai/clip-vit-large-patch14"
    batch_size: 8
    precision: "float16"  # Use half precision to save memory
    description: "High accuracy model for detailed analysis"

  # Experimental models
  experimental:
    name: "laion/CLIP-ViT-B-32-laion2B-s34B-b79K"
    batch_size: 16
    precision: "float32"
    description: "LAION trained model for comparison"

